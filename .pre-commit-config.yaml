repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.7.1
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/commitizen-tools/commitizen
  rev: v3.30.0
  hooks:
    - id: commitizen
      stages: [commit-msg]
      additional_dependencies: [cz-github-jira-conventional]
    - id: commitizen-branch
      stages: [pre-push]

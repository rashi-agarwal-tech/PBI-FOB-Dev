steps:
  - checkout: self
    persistCredentials: true

  - script: |
      echo "Running commitizen to bump version and update release log."
      just bump-version
      current_message=$(git log -1 --pretty=%B)
      new_message="${current_message} [skip ci]"
      git commit --amend -m "$new_message"
    displayName: 'Bump version'

  - script: |
      echo "Fetching the latest Git tag..."
      GIT_TAG=$(git describe --abbrev=0)
      git push origin $GIT_TAG
      echo "##vso[task.setvariable variable=gitTag]$GIT_TAG"
    displayName: 'Get latest tag and merge.'

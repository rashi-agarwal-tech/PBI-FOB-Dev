[tool.poetry]
name = "pbi-tools"
version = "0.7.2"
description = ""
authors = ["Martin Kingston"]
readme = "README.md"
packages = [{ include = "pbi_tools" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
xmltodict = "^0.13.0"
typer = "^0.12.5"
python-dotenv = "^1.0.1"
pendulum = ">=2.0.0,<4.0.0"
fiscalyear = "^0.4.0"
pyyaml = "^6.0.1"
pydantic = "^2.9.2"
msal = "^1.26.0"

[tool.poetry.group.extras]
optional = true

[tool.poetry.group.extras.dependencies]
xlsxwriter = "^3.2.0"
networkx = "^3.3"
matplotlib = "^3.8.4"
snowflake-connector-python = { extras = ["pandas"], version = "^3.12.4" }

[tool.poetry.scripts]
pbi = "pbi_tools.cli:app"
fix-changelog = "scripts.fix_changelog:fix_changelog"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
artifacts-keyring = "^0.4.0"
pytest = "^8.3.3"
pytest-sugar = "^1.0.0"
ruff = "^0.7.1"
# mypy = "^1.13.0"
pre-commit = "^4.0.1"
twine = "^5.1.1"
commitizen = "^3.30.0"
types-requests = "^2.32.0.20241016"
rust-just = "^1.36.0"
pytest-depends = "^1.0.1"
pytest-xdist = "^3.6.1"
pytest-azurepipelines = "^1.0.5"
cz-github-jira-conventional = "^3.0.0"
pytest-cov = "^6.1.1"

[tool.poetry.group.airflow]
optional = true

[tool.poetry.group.airflow.dependencies]
apache-airflow = "^2.10.4"
apache-airflow-providers-google = "^12.0.0"
apache-airflow-providers-snowflake = "^6.0.0"

[tool.commitizen]
name = "cz_github_jira_conventional"
version = "0.7.2"
version_files = [
  "pyproject.toml:tool.poetry.version",
  "pbi_tools/__init__.py",
  "pyproject.toml:version",
]
update_changelog_on_bump = true
gpg_sign = false
tag_format = "v$version"
annotated_tag = true
check_consistency = true
jira_prefix = "FP-"
jira_base_url = "https://drmartens.atlassian.net"
github_repo = "https://projectreboot.visualstudio.com/Windermere%20Discovery/_git/windermere_powerbi"


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "api: marks tests using api calls (deselect with '-m \"not api\"')",
  "cli",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

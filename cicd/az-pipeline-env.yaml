steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(PYTHON_VERSION)"
  - checkout: self
    persistCredentials: true
    clean: true
    fetchDepth: 0

  - script: |
      if [ -d "windermere_powerbi" ]; then
      cd windermere_powerbi || exit 1
      fi
      pip install rust-just
      just install-poetry
    displayName: "Install Python requirements with Poetry"

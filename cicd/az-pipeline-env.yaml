steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(PYTHON_VERSION)'

  - script: |
      pwd
      pip install rust-just
      just install-poetry
    displayName: 'Install Python requirements with Poetry'

  - script: |
      echo "Running commitizen"
      echo $(System.PullRequest.TargetBranch)
      branchName=$(basename $(System.PullRequest.TargetBranch))
      echo "Checking branch: $branchName"
      git fetch origin
      echo $(git branch -r)
      git fetch origin development --depth=100
      git log
      echo "git merge-base origin/$branchName  HEAD"
      echo $(git merge-base origin/$branchName  HEAD)
      echo $(git log $(git merge-base origin/$branchName  HEAD)..HEAD --pretty=format:%s)
      COMMITS=$(git log $(git merge-base origin/$branchName  HEAD)..HEAD --pretty=format:%s)
      echo "These are the commits....."
      echo $COMMITS
      echo "$COMMITS" | poetry run cz check
    displayName: 'Check new commits follow conventional commits.'
    condition: contains(variables['Build.cicd'], 'cd')

  - script: |
      echo "Test bumping the version."
      just bump-dry
    displayName: 'Test bump version'
    condition: contains(variables['Build.cicd'], 'cd')